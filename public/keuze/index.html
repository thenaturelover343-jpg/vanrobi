<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kies de foto</title>
  <style>
    body { margin: 0; background: #05080c; color: #f4f8fb; font-family: Georgia, serif; }
    h1 { font-weight: 400; font-size: 1.4rem; padding: 1.2rem 1rem 0.4rem; }
    p { margin: 0 1rem 1rem; color: #c5d5de; font-family: sans-serif; font-size: 0.95rem; }
    figure { margin: 0 0 2rem; }
    figcaption { font-size: 2rem; padding: 0.6rem 1rem; }
    img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <h1>Kies 1 of 2</h1>
  <p>Dit is alleen om te kijken. Nog niet de achtergrond van de site.</p>
  <figure>
    <figcaption>1 — Koelers</figcaption>
    <img src="1.jpg" alt="Rij roestvrijstalen bierkoelers" />
  </figure>
  <figure>
    <figcaption>2 — Fusten en kraan</figcaption>
    <img src="2.jpg" alt="Bierfusten en een tapzuil" />
  </figure>
</body>
</html>
